<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
</head>
<body>

    <h1>Student Management System</h1>

    <h2>Add Student</h2>

    <form id="studentForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="number" id="age" placeholder="Age" required>
        <input type="text" id="course" placeholder="Course" required>
        <button type="submit">Add Student</button>
    </form>

    <h2>Students</h2>

    <ul id="studentList"></ul>

    <script>
        // Display all students
        async function loadStudents() {
            const response = await fetch("/students");
            const students = await response.json();

            const list = document.getElementById("studentList");
            list.innerHTML = "";

            students.forEach(student => {
                const li = document.createElement("li");

                li.innerHTML = `
                    ${student.name} - Age: ${student.age} - Course: ${student.course}
                    <button onclick="updateStudent('${student._id}', '${student.name}', ${student.age}, '${student.course}')">
                        Update
                    </button>
                    <button onclick="deleteStudent('${student._id}')">
                        Delete
                    </button>
                `;

                list.appendChild(li);
            });
        }

        // Add student
        document.getElementById("studentForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const student = {
                name: document.getElementById("name").value,
                age: Number(document.getElementById("age").value),
                course: document.getElementById("course").value
            };

            await fetch("/students", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            document.getElementById("studentForm").reset();

            loadStudents();
        });

        // Update student
        async function updateStudent(id, oldName, oldAge, oldCourse) {
            const name = prompt("Enter new name:", oldName);
            const age = prompt("Enter new age:", oldAge);
            const course = prompt("Enter new course:", oldCourse);

            if (name === null || age === null || course === null) {
                return;
            }

            const student = {
                name: name,
                age: Number(age),
                course: course
            };

            await fetch(`/students/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            loadStudents();
        }

        // Delete student
        async function deleteStudent(id) {
            const confirmDelete = confirm("Are you sure you want to delete this student?");

            if (!confirmDelete) {
                return;
            }

            await fetch(`/students/${id}`, {
                method: "DELETE"
            });

            loadStudents();
        }

        // Load students when page opens
        loadStudents();
    </script>

</body>
</html>
